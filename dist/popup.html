<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>JCRLattes</title>
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #f8f9fa;
            color: #333;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 2px solid #1565C0;
            padding-bottom: 10px;
        }
        .header img {
            width: 32px;
            height: 32px;
        }
        .header h1 {
            font-size: 18px;
            margin: 0;
            color: #1565C0;
        }
        .header span {
            font-size: 11px;
            color: #666;
        }
        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #1565C0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-action:hover {
            background-color: #0D47A1;
        }
        .btn-action.secondary {
            background-color: #f39c12;
        }
        .btn-action.secondary:hover {
            background-color: #d68910;
        }
        .info-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="images/icon-32.png" alt="JCRLattes">
        <div>
            <h1>JCRLattes</h1>
            <span>Fator de Impacto & Estatísticas</span>
        </div>
    </div>

    <button id="btn-open-propostas" class="btn-action" style="display: none;">
        📁 Ver Propostas
    </button>

    <button id="btn-open-cvs" class="btn-action secondary">
        📊 Banco de Dados Geral de CVs
    </button>

    <div class="info-card">
        <strong>💡 JCRLattes:</strong> Análise de autoria, Fator de Impacto (JCR) e relatórios estatísticos integrados ao Currículo Lattes.
    </div>

    <script src="scripts/popup.js"></script>
</body>
</html>
